<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Julio Serrano — En construcción</title>
  <meta name="description" content="Sitio de Julio Serrano. Muy pronto.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚧</text></svg>">
  <style>
    :root {
      --bg: #f6f4ef;
      --fg: #1c1b19;
      --muted: #6b675f;
      --accent: #c8553d;
      --line: #dcd7cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --fg: #ece9e2;
        --muted: #9a958b;
        --accent: #e07a5f;
        --line: #2c2b28;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { max-width: 560px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 28px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .3; } }
    h1 {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(40px, 9vw, 72px);
      line-height: 1.05;
      letter-spacing: -.02em;
      margin-bottom: 20px;
    }
    p { color: var(--muted); font-size: 18px; line-height: 1.6; }
    footer {
      position: fixed;
      bottom: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main>
    <span class="badge"><span class="dot"></span>En construcción</span>
    <h1>Julio Serrano</h1>
    <p>Estamos preparando algo nuevo. Vuelve pronto.</p>
  </main>
  <footer>&copy; <span id="y">2026</span> julioserrano.site</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
